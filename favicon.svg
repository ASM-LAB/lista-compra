<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Blue Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#2563eb" />

  <!-- Checkmarks in sky -->
  <path d="M 112 182 L 138 208 L 188 158" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 210 118 L 240 148 L 302 86" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 330 118 L 356 144 L 402 98" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Left Fruit (Pear/Apple) -->
  <path d="M 183 235 C 160 185 215 155 220 155 C 220 155 250 195 215 235 Z" fill="#ffffff" />

  <!-- Middle Apple with Leaf -->
  <g fill="#ffffff">
    <!-- Leaf -->
    <path d="M 285 142 C 265 118 290 112 290 112 C 290 112 312 128 285 142 Z" />
    <!-- Apple Body -->
    <path d="M 270 235 C 225 235 225 175 260 162 C 270 158 280 162 285 165 C 290 162 300 158 310 162 C 345 175 345 235 300 235 Z" />
  </g>

  <!-- Right Baguette -->
  <g transform="translate(380, 160) rotate(35)">
    <rect x="-24" y="-50" width="48" height="110" rx="24" fill="#ffffff" />
    <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Basket Handle (behind rim, left side) -->
  <rect x="52" y="130" width="150" height="42" rx="21" fill="none" stroke="#ffffff" stroke-width="22" transform="rotate(-40 127 151)" />

  <!-- Basket Body Cutout/Fill -->
  <path d="M 96 240 L 132 425 C 135 440 148 450 162 450 L 350 450 C 364 450 377 440 380 425 L 416 240 Z" fill="#2563eb" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Vertical Slats -->
  <line x1="172" y1="270" x2="190" y2="420" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="270" x2="256" y2="420" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="340" y1="270" x2="322" y2="420" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

  <!-- Basket Rim (Front) -->
  <rect x="35" y="222" width="442" height="38" rx="19" fill="#ffffff" />
</svg>
